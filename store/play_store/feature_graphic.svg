<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bg" cx="20%" cy="46%" r="85%">
      <stop offset="0%" stop-color="#147463"/>
      <stop offset="55%" stop-color="#0A4F45"/>
      <stop offset="100%" stop-color="#07161C"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="500" fill="url(#bg)"/>

  <!-- faint suit texture, kept clear of the text/card zone -->
  <g fill="#F6F0DE" opacity="0.05" font-family="Liberation Sans, sans-serif" font-weight="bold">
    <text x="860" y="110" font-size="140">&#9824;</text>
    <text x="930" y="330" font-size="110">&#9829;</text>
    <text x="760" y="440" font-size="90">&#9830;</text>
  </g>

  <!-- card motif -->
  <g transform="translate(232,258) rotate(13)">
    <rect x="-85" y="-119" width="170" height="238" rx="24" fill="#F2C14E"/>
  </g>
  <g transform="translate(176,258) rotate(-11)">
    <rect x="-85" y="-119" width="170" height="238" rx="24" fill="#F6F0DE"/>
    <text x="0" y="32" font-family="Liberation Sans, sans-serif" font-weight="bold"
          font-size="170" fill="#0A4F45" text-anchor="middle">A</text>
  </g>

  <!-- wordmark -->
  <text x="410" y="222" font-family="Liberation Sans, sans-serif" font-weight="bold"
        font-size="84" fill="#F6F0DE">BLACKJACK</text>
  <text x="410" y="278" font-family="Liberation Sans, sans-serif" font-weight="bold"
        font-size="42" letter-spacing="4" fill="#56E0B5">ADVANTAGE TRAINER</text>
  <text x="410" y="326" font-family="Liberation Sans, sans-serif"
        font-size="25" fill="#F6F0DE" opacity="0.65">Master basic strategy. Learn Hi-Lo card counting.</text>
</svg>
