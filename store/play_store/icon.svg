<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="32%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#147463"/>
      <stop offset="55%" stop-color="#0A4F45"/>
      <stop offset="100%" stop-color="#07161C"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- back card (gold) -->
  <g transform="translate(292,268) rotate(13)">
    <rect x="-100" y="-140" width="200" height="280" rx="28" fill="#F2C14E"/>
  </g>

  <!-- front card (cream) with mint Ace monogram -->
  <g transform="translate(224,268) rotate(-11)">
    <rect x="-100" y="-140" width="200" height="280" rx="28" fill="#F6F0DE"/>
    <text x="0" y="38" font-family="Liberation Sans, sans-serif" font-weight="bold"
          font-size="200" fill="#0A4F45" text-anchor="middle">A</text>
  </g>
</svg>
